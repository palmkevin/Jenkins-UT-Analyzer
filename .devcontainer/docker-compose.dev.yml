# Devcontainer override: adds a `dev` workspace service to the existing stack in ../docker-compose.yml.
#
# Path note: devcontainer.json lists ../docker-compose.yml FIRST, so the compose *project directory*
# is the repo root — relative paths below (`.`, `.env`) resolve from the repo root, not this folder.
#
# VS Code attaches to `dev`; `runServices` in devcontainer.json keeps only `db` up alongside it, so
# migrate/web/poller stay down for the fast inner loop. Bring the full prod-like stack up on demand:
#   docker compose -f docker-compose.yml -f .devcontainer/docker-compose.dev.yml up web poller
#
# `name` forces a project SEPARATE from the running deployment (project `jenkins-ut-analyzer`, now
# pinned in ../docker-compose.yml rather than derived from the directory), so the devcontainer's
# db/volumes/network are isolated — closing or rebuilding the container can never stop the live
# poller/web or touch their data. Compose takes the `name` from the LAST file listed, which is this
# one.
#
# It still reads `jenkins-ut-analyzer-dev` after the repo rename (ADR-0008) *deliberately*: a compose
# project name prefixes its volumes, so `…-dev_claude-code-config`, `…-dev_gh-config` and
# `…-dev_git-credentials` are keyed by it. Renaming would mount three empty volumes and silently
# discard the Claude Code login, the `gh` token and the Bitbucket credential store — the one-time
# steps devcontainer.json goes to some length to persist. The name only has to be *distinct* from the
# deployment's, not pretty.
name: jenkins-ut-analyzer-dev
services:
  dev:
    # Devcontainer base: Python 3.12 + git + build tools + non-root `vscode` user + tzdata.
    # A thin Dockerfile wraps the upstream image only to drop a broken Yarn apt source that
    # would otherwise fail `apt-get update` and break the docker-outside-of-docker feature
    # (see .devcontainer/Dockerfile). Context is scoped to .devcontainer (the repo-root
    # .dockerignore excludes .devcontainer, so it can't be the build context). Dev-only deps
    # still come from postCreateCommand (`pip install -e '.[dev]'`).
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    volumes:
      - .:/workspaces/lx-ci-monitor:cached
    command: sleep infinity
    env_file: .env
    environment:
      # Load-bearing: zoneinfo/clock normalization (Europe/Luxembourg, DST-aware) — see CLAUDE.md.
      TZ: Europe/Luxembourg
      # Reach the compose `db` service by name (overrides any container-host value from .env).
      DATABASE_URL: postgresql+psycopg://uta:uta@db:5432/uta
    depends_on:
      db:
        condition: service_healthy
